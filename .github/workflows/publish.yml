name: Deploy slides to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render slides
        run: quarto render slides.qmd

      - name: Stage site
        run: |
          mkdir -p _site
          cp slides.html _site/index.html
          cp -r slides_files _site/ 2>/dev/null || true
          cp -r figures _site/
          cp -r _extensions _site/ 2>/dev/null || true
          cp custom.css _site/ 2>/dev/null || true
          cp mathjax-config.js _site/ 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
